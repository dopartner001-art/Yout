name: Build Yout APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fSL "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Prepare signing keystores
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -genkeypair -v -keystore my-upload-key.jks -storepass youtrelease2026 -alias upload -keypass youtrelease2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Yout Support,O=Yout,C=BD"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: youtrelease2026
          KEY_PASSWORD: youtrelease2026
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Copy direct APK
        run: cp app/build/outputs/apk/release/app-release.apk Yout.apk

      - name: Upload Yout APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yout-APK
          path: Yout.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y || true
          gh release create latest Yout.apk --title "Yout Latest Release APK" --notes "Direct APK download for Android (no unzip needed). Open the laptop browser link inside the app to view from a laptop."
